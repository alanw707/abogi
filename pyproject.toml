[project]
name = "abogi"
version = "0.0.1"
description = "Voice-first personal chief of staff agent built on Microsoft Foundry"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-agentserver-responses>=2.4",
    "azure-ai-projects>=2.10",
    "azure-identity>=1.27.0",
    "azure-keyvault-secrets>=4.12.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "httpx<1",
    "mcp>=2.3.0",
    "openai>=1.99",
    "opentelemetry-api>=1.45",
    "opentelemetry-instrumentation-httpx>=0.66b2",
]

[project.scripts]
abogi = "abogi.cli:cli"

[project.optional-dependencies]
voice = [
    "azure-ai-voicelive[aiohttp]>=1.3.1",
]
# The Windows tray client (python -m abogi.channels.tray); Windows-only libraries.
tray = [
    "azure-ai-voicelive[aiohttp]>=1.3.1",
    "sounddevice>=0.5; sys_platform == 'win32'",
    "pynput>=1.8; sys_platform == 'win32'",
    "pystray>=0.19.5; sys_platform == 'win32'",
    "pillow>=11; sys_platform == 'win32'",
]

discord = [
    "discord.py>=2.5",
]

[dependency-groups]
dev = [
    "azure-ai-voicelive[aiohttp]>=1.3.1",
    "numpy>=2.5.5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abogi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
